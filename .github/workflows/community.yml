name: StreetStar community integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  community:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: streetstar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d streetstar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/streetstar_ci
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate isolated CI login credentials
        run: |
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify the community API with a temporary test database
        run: |
          npm start > /tmp/streetstar-ci-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/test-community.mjs
          node scripts/test-members.mjs
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/streetstar-ci-server.log || true
