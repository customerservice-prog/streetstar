name: StreetStar CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run audit:colors
      - run: npm run typecheck
      - run: node scripts/check-viral-ux.mjs
      - run: node scripts/check-auto-posters.mjs
      - run: npm run build
