name: Generate authentic Bajo Mundo video thumbnails
on:
  push:
    branches: [bajo-mundo-static-thumbnails]
    paths:
      - ".github/workflows/generate-bajo-posters.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bajo-mundo-static-thumbnails
      - name: Retrieve original clip frame
        env:
          DOWNLOAD_URL: 'https://media.descriptusercontent.com/v3/proxy/remux?url=https%3A%2F%2Fapi.descript.com%2Fv2%2Fpublished_projects%2F6ee4f27b-58d5-42f2-afcb-282a75544713%2Fhls%3Fexpiration%3D1794666857945%26signature%3Db31c97eb25c1184dac8ee91af514928b7a10c809bdbb99b14ab17f9f5b0b0cc9&filename=El+Alfa+habla+sobre+lo+ocurrido+en+Miami.mp4&mediaCacheBucketName=production-273614-media-cache&expiration=1794663258&signature=547503afa3a460ad7ecc26d95082ed2aab6c634167350670c2e201893dd09c28'
        run: |
          set -euo pipefail
          python -m pip install --quiet imageio-ffmpeg pillow
          python - <<'PY'
          import os,requests
          url=os.environ["DOWNLOAD_URL"]
          with requests.get(url,timeout=80,stream=True) as r:
              print("Video response",r.status_code,r.headers.get("content-type"))
              if r.status_code!=200:
                  print("Error excerpt",r.text[:500]);r.raise_for_status()
              with open("/tmp/clip.mp4","wb") as out:
                  for piece in r.iter_content(chunk_size=1024*1024):
                      if piece:out.write(piece)
          print("Video bytes",os.path.getsize("/tmp/clip.mp4"))
          PY
          mkdir -p public/posters
          FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FFMPEG" -hide_banner -loglevel error -y -ss 2 -i /tmp/clip.mp4 -frames:v 1 -vf "scale=640:360:force_original_aspect_ratio=decrease,pad=640:360:(ow-iw)/2:(oh-ih)/2" -q:v 4 public/posters/video-2.jpg
          file public/posters/video-2.jpg
      - name: Commit poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posters/video-2.jpg
          git commit -m "Add authentic El Alfa video poster"
          git push origin HEAD:refs/heads/bajo-mundo-static-thumbnails
