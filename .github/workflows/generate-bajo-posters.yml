name: Generate authentic Bajo Mundo video thumbnails
on:
  push:
    branches: [bajo-mundo-static-thumbnails]
    paths:
      - ".github/workflows/generate-bajo-posters.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bajo-mundo-static-thumbnails
      - name: Download poster frame from published source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade yt-dlp
          ffmpeg -hide_banner -version | head -n 1
          mkdir -p public/posters
          yt-dlp -v --no-playlist -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "/tmp/clip.%(ext)s" "https://share.descript.com/view/xs2fzlyBKnK"
          find /tmp -maxdepth 1 -name "clip.*" -printf "%f %s bytes\\n"
          ffmpeg -y -ss 1 -i /tmp/clip.mp4 -frames:v 1 -vf "scale=640:360:force_original_aspect_ratio=decrease,pad=640:360:(ow-iw)/2:(oh-ih)/2" -q:v 4 public/posters/video-2.jpg
          file public/posters/video-2.jpg
      - name: Commit generated poster
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posters/video-2.jpg
          git commit -m "Generate real poster frame for El Alfa clip"
          git push origin HEAD:refs/heads/bajo-mundo-static-thumbnails
